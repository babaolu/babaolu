name: AI Profile Update

on:
  schedule:
    - cron: '0 4 * * 0'    # Every Sunday at 04:00 UTC (05:00 WAT)
  workflow_dispatch:       # Manual trigger from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # Needed to commit README.md changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate AI profile
        env:
          # Falls back to default GITHUB_TOKEN if PAT_TOKEN secret is not set
          GITHUB_TOKEN:   ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER:    ${{ github.repository_owner }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_profile.py

      - name: Commit and push if README changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config --global user.name  "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh AI profile [bot] [skip ci]"
            git push
          fi
